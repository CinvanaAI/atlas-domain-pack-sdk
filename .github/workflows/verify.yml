name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test tooling
        run: python -m pip install --upgrade pip setuptools wheel pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Validate the reference pack
        run: python -m atlas_domain_pack_sdk.validate_pack examples/research_notes --json
      - name: Compile package
        run: python -m compileall -q atlas_domain_pack_sdk
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
